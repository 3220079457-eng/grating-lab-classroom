<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-label="分光计调节与测量"><rect width="720" height="680" fill="#fffdf6"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#183c32"><text x="40" y="42" font-size="16">大学物理实验　/　教材第 210 页内容重排</text><text x="40" y="96" font-size="35" font-weight="bold">分光计调节与测量</text><text x="40" y="133" font-size="19">先建立正入射，再读同一级谱线的左右角位置。</text><g fill="none" stroke="#476458" stroke-width="3"><circle cx="180" cy="245" r="80"/><circle cx="495" cy="245" r="80"/><path d="M100 245H260M180 165V325M415 245H575M495 165V325"/></g><path d="M147 210v44M213 241v44M462 224v44M528 224v44" stroke="#bd8022" stroke-width="6"/><text x="110" y="352" font-size="18">左右谱线不同高</text><text x="425" y="352" font-size="18">调至同高</text><text x="40" y="401" font-size="23" font-weight="bold">观察目镜中各级谱线的高度</text><text x="40" y="453" font-size="19">① 调望远镜至无穷远，使平行光管发出平行光。</text><text x="40" y="497" font-size="19">② 调整光栅面与刻线，再用反射像检查正入射。</text><text x="40" y="541" font-size="19">③ 记零级双游标，测 ±1、±2 级各色谱线。</text><text x="40" y="585" font-size="19">④ 测有效受照宽度，比较遮挡前后的黄双线。</text><text x="40" y="629" font-size="19">取光栅边缘。使用配套光源电源，避免直视汞灯。</text></g></svg>
