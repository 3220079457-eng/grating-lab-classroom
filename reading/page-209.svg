<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-label="分辨本领与角色散率"><rect width="720" height="680" fill="#fffdf6"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#183c32"><text x="40" y="42" font-size="16">大学物理实验　/　教材第 209 页内容重排</text><text x="40" y="96" font-size="35" font-weight="bold">分辨本领与角色散率</text><text x="40" y="133" font-size="19">比较汞灯 577.0 nm 与 579.0 nm 两条黄线。</text><path d="M65 320H650" stroke="#839389"/><g fill="none" stroke-width="4"><path stroke="#ad761d" d="M82 311Q202 310 251 197T357 241Q400 314 470 312"/><path stroke="#527651" d="M173 311Q293 310 342 197T448 241Q491 314 561 312"/></g><text x="150" y="350" font-size="18">两条邻近谱线的强度轮廓（示意）</text><text x="40" y="401" font-size="23" font-weight="bold">瑞利判据 · 峰间距与峰宽</text><text x="40" y="453" font-size="19">分辨本领　R = λ/Δλmin = |k|N</text><text x="40" y="497" font-size="19">N ≈ L/d，其中 L 是沿周期方向的受照宽度。</text><text x="40" y="541" font-size="19">角色散率　D = dφ/dλ = k/(d cos φ)</text><text x="40" y="585" font-size="19">在同一级对光栅方程求导，角度使用弧度。</text><text x="40" y="629" font-size="19">角距取决于色散率，能否分开还取决于谱线宽度。</text></g></svg>
