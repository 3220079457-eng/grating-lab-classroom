<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-label="光栅结构与光谱级次"><rect width="720" height="680" fill="#fffdf6"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#183c32"><text x="40" y="42" font-size="16">大学物理实验　/　教材第 208 页内容重排</text><text x="40" y="96" font-size="35" font-weight="bold">光栅结构与光谱级次</text><text x="40" y="133" font-size="19">平行光正入射到透射光栅，望远镜沿不同方向接收衍射光。</text><path d="M60 245H530M260 245L510 150M260 245L510 340" fill="none" stroke="#248563" stroke-width="4"/><path d="M260 180v130" stroke="#a46e28" stroke-width="8"/><g font-size="18"><text x="62" y="226">入射平行光 →</text><text x="231" y="340">光栅</text><text x="520" y="155">+1 级</text><text x="535" y="250">0 级</text><text x="520" y="345">−1 级</text></g><text x="40" y="401" font-size="23" font-weight="bold">光路与级次</text><text x="40" y="453" font-size="19">光栅方程　d sin φ = kλ</text><text x="40" y="497" font-size="19">相邻刻线的光程差等于整数个波长时出现主极大。</text><text x="40" y="541" font-size="19">d 是刻线周期，理想狭缝模型给出 d = a + b。</text><text x="40" y="585" font-size="19">同一级中，波长越长，谱线与零级的角距离越大。</text></g></svg>
