<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-label="数据处理与思考"><rect width="720" height="680" fill="#fffdf6"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" fill="#183c32"><text x="40" y="42" font-size="16">大学物理实验　/　教材第 211 页内容重排</text><text x="40" y="96" font-size="35" font-weight="bold">数据处理与思考</text><text x="40" y="133" font-size="19">用同一级、同色、同一游标的左右读数配对。</text><g font-size="19"><text x="65" y="196">谱线</text><text x="190" y="196">波长 / nm</text><text x="370" y="196">每一级测量</text><text x="65" y="235">蓝</text><text x="190" y="235">435.8</text><text x="370" y="235">左 Ⅰ、左 Ⅱ</text><text x="65" y="270">绿</text><text x="190" y="270">546.1</text><text x="370" y="270">右 Ⅰ、右 Ⅱ</text><text x="65" y="305">黄一 / 黄二</text><text x="190" y="305">577.0 / 579.0</text><text x="370" y="305">平均角与光栅常数</text></g><path d="M60 208H654M60 320H654" stroke="#648374"/><text x="40" y="401" font-size="23" font-weight="bold">表 4-1 · 汞谱线与测量栏目</text><text x="40" y="453" font-size="19">左右同级角距取一半，再平均两个游标所得的 φ。</text><text x="40" y="497" font-size="19">各次 dᵢ = |k|λ / sin |φ|，取有效测量的平均值。</text><text x="40" y="541" font-size="19">同图绘制一级、二级 φ–λ 曲线，比较实测斜率。</text><text x="40" y="585" font-size="19">讨论狭缝宽度、光栅和棱镜的光谱以及未知波长测量。</text></g></svg>
